<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Acordo Certo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="header">
            <div class="header-left">
                <svg class="back-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>
                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2ZmZmZmZiI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTQuMmMtMi41IDAtNC43MS0xLjI4LTYtMy4yMi4wMy0xLjk5IDQtMy4wOCA2LTMuMDggMS45OSAwIDUuOTcgMS4wOSA2IDMuMDgtMS4yOSAxLjk0LTMuNSAzLjIyLTYgMy4yMnoiLz48L3N2Zz4=" alt="Perfil" class="profile-pic" style="background-color: #b0bec5;">
                <div class="header-info">
                    <div class="header-title">
                        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Atendimento Digital</h1>
                        <svg class="verified-badge" viewBox="0 0 24 24" width="16" height="16">
                            <path fill="#00A5F4" d="M11.99 2L14.25 3.62L17.04 3.2L17.96 5.86L20.5 7.08L19.66 9.77L21.5 11.99L19.66 14.22L20.5 16.91L17.96 18.13L17.04 20.79L14.25 20.37L11.99 21.99L9.73 20.37L6.94 20.79L6.02 18.13L3.48 16.91L4.32 14.22L2.48 11.99L4.32 9.77L3.48 7.08L6.02 5.86L6.94 3.2L9.73 3.62L11.99 2Z"></path>
                            <path fill="#FFFFFF" d="M10.48 16.1L6.32 11.94L7.73 10.53L10.48 13.28L16.25 7.51L17.66 8.92L10.48 16.1Z"></path>
                        </svg>
                    </div>
                    <p>Conta Oficial</p>
                </div>
            </div>
        </header>

        <!-- Área de Chat -->
        <main class="chat-area" id="chatArea">
            <!-- Mensagens aparecerão aqui -->
        </main>

        <!-- Campo de Mensagem Inferior -->
        <footer class="footer">
            <div class="footer-content">
                <input type="file" id="fileInput" style="display: none;">
                <button id="attachBtn" onclick="document.getElementById('fileInput').click()" class="attach-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M1.816 15.556v.002c0 1.502.584 2.912 1.646 3.972s2.472 1.647 3.974 1.647a5.58 5.58 0 0 0 3.972-1.645l9.547-9.548c.769-.768 1.147-1.767 1.058-2.817-.079-.968-.548-1.927-1.319-2.698-1.594-1.592-4.068-1.711-5.517-.262l-7.916 7.915c-.881.881-.792 2.25.214 3.261.959.958 2.423 1.053 3.263.215l5.511-5.512c.28-.28.267-.722.053-.936l-.244-.244c-.191-.191-.567-.349-.957.04l-5.506 5.506c-.18.18-.635.127-.976-.214-.098-.097-.576-.613-.213-.973l7.915-7.917c.818-.817 2.267-.699 3.23.262.5.501.802 1.1.849 1.685.051.573-.156 1.111-.589 1.543l-9.547 9.549a3.97 3.97 0 0 1-2.829 1.171 3.975 3.975 0 0 1-2.83-1.173 3.973 3.973 0 0 1-1.172-2.828c0-1.071.415-2.076 1.172-2.83l7.209-7.211c.157-.157.264-.579.028-.814L11.5 4.36a.57.57 0 0 0-.834.018l-7.205 7.207a5.577 5.577 0 0 0-1.645 3.971z"></path>
                    </svg>
                </button>
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Digite uma mensagem..." autocomplete="off">
                </div>
                <button id="sendBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    
    <!-- Script Principal -->
    <script src="script.js"></script>
</body>
</html>
