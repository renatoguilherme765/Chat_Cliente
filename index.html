<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renegociação Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho Fixo -->
        <header class="header">
            <h1>Renegociação Online</h1>
            <p>Atendimento Automático</p>
        </header>

        <!-- Área de Chat -->
        <main class="chat-area" id="chatArea">
            <!-- As mensagens serão inseridas aqui via JS -->
        </main>

        <!-- Campo de Mensagem Inferior -->
        <footer class="footer">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Digite sua mensagem..." autocomplete="off">
                <button id="sendBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
